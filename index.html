<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sanctuary</title>
<!-- Percent-encoded in full: a loosely encoded data URI is rejected when the
     standalone build is opened straight off disk, where file: is its own origin. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%230b0a10'/%3E%3Cpath%20d='M8%202L11%208L8%2014L5%208Z'%20fill='%23c8a03a'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #c8b88a;
    font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    cursor: default;
  }
  #game {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: none;
  }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 6px;
    text-align: center; font-size: 11px; color: #5a4f38;
    pointer-events: none; letter-spacing: 1px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">click to focus</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
